        python3 tests/test_claude_wrapper_hooks.py
        python3 tests/test_claude_wrapper_mutual_shim_loop.py
        python3 tests/test_claude_wrapper_user_binary_resolution.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_claude_teams_fallback_path.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_claude_teams_env.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_claude_teams_trust_optin.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_omo_fallback_path.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_omx_fallback_path.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_omc_fallback_path.py
        python3 tests/test_issue_2448_shell_claude_wrapper_dispatch.py
        python3 tests/test_issue_6714_zsh_shim_noclobber.py
        python3 tests/test_shell_git_branch_stale_cwd.py
        python3 tests/test_shell_git_config_remote_url_parsing.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_claude_hook_stop_last_assistant.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_claude_hook_clear_running_status.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_claude_hook_push_notification.py
