name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-regression:
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'warp-macos-15-arm64-6x' }}
    timeout-minutes: 30
    env:
      BMUX_CI_XCODE_APP: ${{ vars.BMUX_CI_XCODE_APP_MACOS_15 }}
      BMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh
      - name: Run task relevance regression
        run: swift test --package-path Packages/macOS/ProvenanceEngine --filter TaskRelevanceEvidenceTests
