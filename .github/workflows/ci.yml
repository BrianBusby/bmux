name: 'Diagnostic only: app-host zombie ownership'
'on':
  workflow_dispatch:
    inputs:
      app_host_process_diagnostics:
        description: Diagnostic only; cannot satisfy normal merge gates
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: app-host-zombie-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  app-host-unit-tests:
    name: 'DIAGNOSTIC ONLY: macOS 15 shard 2 with NSZombie'
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'warp-macos-15-arm64-6x' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 2
    env:
      BMUX_CI_XCODE_APP: ${{ vars.BMUX_CI_XCODE_APP_MACOS_15 }}
      BMUX_CI_REQUIRED_MACOS_SDK_MAJOR: '26'
      BMUX_SKIP_ZIG_BUILD: '1'
      BMUX_APP_HOST_SPLIT_THEME_REGRESSION_SHARD: '3'
      BMUX_APP_HOST_BROWSER_PROXY_REGRESSION_SHARD: '1'
      BMUX_APP_HOST_OPTION_ALT_REGRESSION_SHARD: '2'
      BMUX_APP_HOST_SSH_MANUAL_RECONNECT_REGRESSION_SHARD: '3'
      BMUX_APP_HOST_MATTE_REGRESSION_SHARD: '3'
      BMUX_APP_HOST_THEME_PICKER_REGRESSION_SHARD: '4'
      BMUX_APP_HOST_CLI_NO_SOCKET_REGRESSION_SHARD: '4'
      BMUX_APP_HOST_CODEX_STOP_REGRESSION_SHARD: '4'
      SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no
      BMUX_XCODEBUILD_NONINTERACTIVE_POST_TEST_TIMEOUT_SECONDS: '45'
    steps:
    - name: Clear stale git locks (self-hosted reused workspace)
      shell: bash
      run: |
        # Self-hosted macOS runners reuse the workspace. A job cancelled or
        # killed mid-checkout can leave a stale .git/modules/*/index.lock that
        # fails every later submodule checkout (e.g. ghostty). Clear them first.
        ws="${GITHUB_WORKSPACE:-$PWD}"
        rm -f "$ws/.git/index.lock" 2>/dev/null || true
        if [ -d "$ws/.git/modules" ]; then
          find "$ws/.git/modules" -type f -name "*.lock" -delete 2>/dev/null || true
        fi
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Checkout required submodules
      run: |
        set -euo pipefail
        git submodule update --init --depth=1 ghostty vendor/bonsplit
    - name: Select Xcode
      run: |
        set -euo pipefail
        ./scripts/select-ci-xcode.sh
    - name: Capture Ghostty revision
      id: ghostty-revision
      run: |
        echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Cache GhosttyKit.xcframework
      id: cache-ghosttykit
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: GhosttyKit.xcframework
        key: ghosttykit-${{ steps.ghostty-revision.outputs.sha }}
    - name: Download pre-built GhosttyKit.xcframework
      if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
      run: |
        ./scripts/download-prebuilt-ghosttykit.sh
    - name: Install Rust
      run: |
        ./scripts/install-rust-ci.sh
    - name: Cache Swift packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: .ci-source-packages
        key: spm-${{ hashFiles('bmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: spm-
    - name: Sanitize Swift package cache
      run: python3 scripts/ci/sanitize-xcode-source-packages-cache.py .ci-source-packages
    - name: Prepare isolated DerivedData
      run: |
        set -euo pipefail
        DERIVED_DATA_PATH="${RUNNER_TEMP}/bmux-derived-data-tests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-shard-${{ matrix.shard }}"
        rm -rf "$DERIVED_DATA_PATH"
        mkdir -p "$DERIVED_DATA_PATH"
        echo "BMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"
    - name: Resolve Swift packages
      run: "set -euo pipefail\nSOURCE_PACKAGES_DIR=\"$PWD/.ci-source-packages\"\nmkdir -p \"$SOURCE_PACKAGES_DIR\"\
        \n\nfor attempt in 1 2 3; do\n  if xcodebuild -project bmux.xcodeproj -scheme bmux-unit -configuration Debug\
        \ \\\n    -derivedDataPath \"$BMUX_DERIVED_DATA_PATH\" \\\n    -clonedSourcePackagesDirPath \"$SOURCE_PACKAGES_DIR\"\
        \ \\\n    -resolvePackageDependencies; then\n    # Guard against a stale/poisoned Swift-package cache: a\
        \ restored\n    # .ci-source-packages can make resolve report success without the\n    # binary artifacts\
        \ (Sparkle/Sentry) actually present, which then\n    # fails the build. Verify they materialized; if not,\
        \ clear and retry.\n    if [ -d \"$SOURCE_PACKAGES_DIR/artifacts/sparkle/Sparkle/Sparkle.xcframework\" ]\
        \ && [ -d \"$SOURCE_PACKAGES_DIR/artifacts/sentry-cocoa/Sentry/Sentry.xcframework\" ]; then\n      exit\
        \ 0\n    fi\n    echo \"Resolve succeeded but binary artifacts are missing (stale cache); clearing and retrying\"\
        \ >&2\n    rm -rf \"$SOURCE_PACKAGES_DIR\"  # whole dir \u2014 resolve will not re-materialize artifacts\
        \ into a partial tree\n  fi\n  if [ \"$attempt\" -eq 3 ]; then\n    echo \"Failed to resolve Swift packages\
        \ after 3 attempts\" >&2\n    exit 1\n  fi\n  echo \"Package resolution failed on attempt $attempt, retrying...\"\
        \n  sleep $((attempt * 5))\ndone\n"
    - name: Run Ghostty split-theme appearance regression
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_SPLIT_THEME_REGRESSION_SHARD) }}
      run: |
        set -euo pipefail
        DERIVED_DATA_PATH="${RUNNER_TEMP:-/tmp}/bmux-terminal-core-split-theme"
        rm -rf "$DERIVED_DATA_PATH"
        (
          cd Packages/macOS/BmuxTerminalCore
          xcodebuild \
            -scheme BmuxTerminalCore-Package \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            build-for-testing
        )
        xcrun xctest "$DERIVED_DATA_PATH/Build/Products/Debug/BmuxTerminalCoreTests.xctest"
    - name: Enable XCTest automation mode
      run: |
        set -euo pipefail
        if ! command -v automationmodetool >/dev/null 2>&1; then
          echo "::warning::automationmodetool is unavailable; XCTest will use its default automation-mode setup"
          exit 0
        fi
        if sudo -n true 2>/dev/null; then
          sudo -n automationmodetool enable-automationmode-without-authentication
        else
          echo "::warning::Passwordless sudo unavailable; XCTest will use its default automation-mode setup"
        fi
    - name: Run browser settings and system proxy regressions
      env:
        BMUX_APP_HOST_PROCESS_DIAGNOSTICS: ${{ (github.event_name == 'pull_request' || inputs.app_host_process_diagnostics)
          && '1' || '0' }}
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_BROWSER_PROXY_REGRESSION_SHARD) }}
      run: |
        # Focused gate for https://github.com/manaflow-ai/bmux/issues/5888.
        # Keep this isolated invocation so a failure or abort in another
        # app-host suite cannot prevent the proxy mirror regression running.
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/BrowserSystemProxyMirrorTests \
          -only-testing:bmuxTests/BrowserHiddenWebViewDiscardPolicyTests \
          -only-testing:bmuxTests/BrowserThemeSettingsTests \
          -only-testing:bmuxTests/GhosttyBackgroundThemeTests \
          -only-testing:bmuxTests/PanelAppearanceCompositingTests \
          -only-testing:bmuxTests/TitlebarProductContractTests \
          -only-testing:bmuxTests/BrowserUnderPageBackgroundTests \
          -only-testing:bmuxTests/BrowserInitialLifecycleTests \
          -only-testing:bmuxTests/BrowserDiscardReadinessTests \
          -only-testing:bmuxTests/SidebarWidthPersistencePolicyTests \
          -only-testing:bmuxTests/HermesResumeExecutionTests \
          -only-testing:bmuxTests/RestorableAgentSessionStalePIDTests \
          -only-testing:bmuxTests/BrowserRemoteStoreScopeTests \
          -only-testing:bmuxTests/ClaudeSessionEndScopeTests \
          -only-testing:bmuxTests/CloudAttachRetryContractTests \
          -only-testing:bmuxTests/RemoteTmuxSessionListParserTests \
          -only-testing:bmuxTests/FileExplorerGitStatusProviderTests \
          -only-testing:bmuxTests/MarkdownMermaidZoomTests \
          -only-testing:bmuxTests/ManagedAppearanceStartupContractTests \
          -only-testing:bmuxTests/AgentLaunchEnvironmentTests \
          -only-testing:bmuxTests/SSHWorkspaceCreationTests \
          -only-testing:bmuxTests/SSHAgentEnvironmentTests \
          -only-testing:bmuxTests/SSHPTYLifecycleContractTests \
          -only-testing:bmuxTests/RespawnWindowProtocolTests \
          -only-testing:bmuxTests/WorkspaceFallbackContractTests \
          -only-testing:bmuxTests/GlobalSearchShortcutConflictTests \
          -only-testing:bmuxTests/BrowserDownloadQuarantineTests \
          -only-testing:bmuxTests/FilePreviewSaveShortcutTests \
          -only-testing:bmuxTests/BrowserInspectorWindowOwnershipTests \
          test
    - name: Run Option/Alt sided-modifier regression
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_OPTION_ALT_REGRESSION_SHARD) }}
      run: |
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/GhosttyOptionAsAltModsTests \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHPaneCloseSignalDoesNotReportSessionEndToSharedTransport \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHPaneCloseSignalDoesNotTerminateWrappedSSHChild \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHStartupRetriesTransientSSHExitBeforeReportingSessionEnd \
          -only-testing:bmuxTests/SSHStaleControlSocketTests \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHStartupStopsAtConfiguredReconnectLimit \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHStartupDoesNotRetryNonTransientSSHExit \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHSignalDerivedChildExitReportsSessionEnd \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHSignalDuringReconnectDelayDoesNotStartAnotherSSH \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHStartupPrintsFinalErrorBannerWhenStderrIsCaptured \
          -only-testing:bmuxTests/CLINotifyProcessIntegrationRegressionTests/testSSHStartupForwardsStdinToBackgroundedSSH \
          -only-testing:bmuxTests/CodexMonitorLeaseTests \
          test
    - name: Verify bundled CLI artifact and native test
      if: ${{ matrix.shard == 3 }}
      run: |
        set -euo pipefail
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$PWD/.ci-source-packages" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/BundledCLILinkageTests test
        artifact_test_exit=0
        if python3 tests/test_bundled_cli_artifact.py; then
          :
        else
          artifact_test_exit=$?
        fi
        CLI_BIN="$BMUX_DERIVED_DATA_PATH/Build/Products/Debug/bmux DEV.app/Contents/Resources/bin/bmux"
        socket_test_exit=0
        if BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_closed_peer_receive.py; then
          :
        else
          socket_test_exit=$?
        fi
        echo "Bundled CLI artifact tests: $artifact_test_exit; closed-peer receive tests: $socket_test_exit"
        if [ "$artifact_test_exit" -ne 0 ]; then exit "$artifact_test_exit"; fi
        if [ "$socket_test_exit" -ne 0 ]; then exit "$socket_test_exit"; fi
        python3 scripts/verify-bundled-cli.py \
          "$BMUX_DERIVED_DATA_PATH/Build/Products/Debug/bmux DEV.app" \
          --archive "$RUNNER_TEMP/bmux-cli-debug.tar.gz"
        du -h "$RUNNER_TEMP/bmux-cli-debug.tar.gz"
    - name: Upload Debug CLI dependency closure
      if: ${{ matrix.shard == 3 }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bmux-cli-debug
        path: ${{ runner.temp }}/bmux-cli-debug.tar.gz
        if-no-files-found: error
        retention-days: 3
    - name: Run Codex Stop hook fixture regressions
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_CODEX_STOP_REGRESSION_SHARD) }}
      run: |
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/CodexStopPayloadFailureTests \
          -only-testing:bmuxTests/CodexStopTranscriptFailureTests \
          -only-testing:bmuxTests/CodexStopTurnScopeTests \
          test
    - name: Run SSH cleanup error regression
      if: ${{ matrix.shard == 1 }}
      run: |
        set -euo pipefail
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$PWD/.ci-source-packages" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/SSHCleanupErrorTests \
          -only-testing:bmuxTests/RemotePTYErrorPolicyTests test
    - name: Run right sidebar shortcut availability fixtures
      if: ${{ matrix.shard == 3 }}
      run: |
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/RightSidebarModeAvailabilityShortcutTests \
          -only-testing:bmuxTests/RightSidebarModeShortcutHintTests \
          test
    - name: Run Claude notification target fixtures
      if: ${{ matrix.shard == 2 }}
      run: |
        set -euo pipefail
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$PWD/.ci-source-packages" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/ClaudeNotificationTargetTests \
          -only-testing:bmuxTests/ClaudeNotificationStatusLifecycleTests test
    - name: Run SSH manual reconnect handoff regression
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_SSH_MANUAL_RECONNECT_REGRESSION_SHARD) }}
      run: |
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/SSHStartupManualReconnectTests \
          -only-testing:bmuxTests/SSHRemoteReconnectOwnerTests \
          -only-testing:bmuxTests/SSHDisconnectedPlaceholderTests \
          test
    - name: Run Codex rejected ambient routing regressions
      if: ${{ matrix.shard == 2 }}
      run: |
        set -euo pipefail
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$PWD/.ci-source-packages" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/CodexRejectedAmbientTests \
          -only-testing:bmuxTests/CLISocketFixtureCompletionTests test
    - name: Run matte chrome native regressions
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_MATTE_REGRESSION_SHARD) }}
      run: |
        # Run the affected native suites before unrelated legacy fixtures.
        # Full-suite coverage below remains intact; incomplete runs fail.
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        scripts/ci/run-in-console-session.sh \
          env TEST_RUNNER_NSZombieEnabled=YES \
          scripts/ci/run-app-host-xcodebuild.sh \
          -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
          -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
          -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
          -disableAutomaticPackageResolution \
          -destination "platform=macOS" \
          BMUX_SKIP_ZIG_BUILD=1 \
          -only-testing:bmuxTests/MatteTitlebarContrastTests \
          -only-testing:bmuxTests/MatteTerminalConfigurationTests \
          -only-testing:bmuxTests/WorkspacePopoverFocusRoutingTests \
          -only-testing:bmuxTests/MatteTerminalInsetRenderingTests \
          -only-testing:bmuxTests/MatteTerminalBackdropCompositionTests \
          -only-testing:bmuxTests/MatteChromePreferenceTests \
          -only-testing:bmuxTests/TerminalSurfaceRecoveryTests \
          -only-testing:bmuxTests/TerminalKeyRepeatDeliveryTests \
          -only-testing:bmuxTests/TerminalNativeInputDeliveryTests \
          -only-testing:bmuxTests/MatteTitlebarDragRoutingTests \
          -only-testing:bmuxTests/ForeignFirstResponderPolicyTests \
          -only-testing:bmuxTests/KeyboardFocusOwnerViewTests \
          -only-testing:bmuxTests/RightSidebarHeaderChromeMetricsTests \
          -only-testing:bmuxTests/SidebarWorkspaceGroupHeaderMetricsTests \
          -only-testing:bmuxTests/ContentViewFileDropOverlayInstallationTests \
          test
    - name: Run unit tests
      env:
        BMUX_APP_HOST_PROCESS_DIAGNOSTICS: ${{ (github.event_name == 'pull_request' || inputs.app_host_process_diagnostics)
          && '1' || '0' }}
      run: |
        set -euo pipefail
        SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
        SHARD_ARGS="$RUNNER_TEMP/bmux-unit-shard-${{ matrix.shard }}.args"
        python3 scripts/ci/bmux_unit_test_shard.py \
          --shard-index "${{ matrix.shard }}" \
          --shard-total 4 \
          --output "$SHARD_ARGS"
        ONLY_TESTING_ARGS=()
        while IFS= read -r arg; do
          [ -n "$arg" ] && ONLY_TESTING_ARGS+=("$arg")
        done < "$SHARD_ARGS"
        run_unit_tests() {
          # These app-host tests create real SwiftUI/WebKit/Ghostty windows and
          # intermittently crash inside XCTest's post-test memory checker or
          # leave native display/WebKit work alive on GitHub macOS runners.
          # When that happens, Swift's crash/backtrace handling or the stale
          # app-host process keeps xcodebuild alive until the job-level timeout,
          # hiding the actual unit test summary.
          # The app-host wrapper also serializes GUI XCTest ownership per Mac,
          # while still allowing shards on separate Macs to run in parallel.
          scripts/ci/run-in-console-session.sh \
            env TEST_RUNNER_NSZombieEnabled=YES \
            scripts/ci/run-app-host-xcodebuild.sh \
            -project bmux.xcodeproj -scheme bmux-unit -configuration Debug \
            -derivedDataPath "$BMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -disableAutomaticPackageResolution \
            -destination "platform=macOS" \
            "${ONLY_TESTING_ARGS[@]}" \
            BMUX_SKIP_ZIG_BUILD=1 \
            test 2>&1 &
          local xcodebuild_pid=$!
          local timeout_seconds="${BMUX_UNIT_TEST_TIMEOUT_SECONDS:-900}"
          local deadline=$((SECONDS + timeout_seconds))
          while kill -0 "$xcodebuild_pid" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "xcodebuild unit test timeout after ${timeout_seconds}s; terminating"
              kill -TERM "$xcodebuild_pid" 2>/dev/null || true
              sleep 5
              kill -KILL "$xcodebuild_pid" 2>/dev/null || true
              wait "$xcodebuild_pid" 2>/dev/null || true
              return 124
            fi
            sleep 5
          done
          wait "$xcodebuild_pid"
        }

        # Stream output via tee so CI logs are visible in real time, while still
        # retaining output for the bounded SwiftPM dependency retry.
        TEST_OUTPUT="$RUNNER_TEMP/bmux-unit-output-shard-${{ matrix.shard }}.txt"
        set +e
        run_unit_tests | tee "$TEST_OUTPUT"
        EXIT_CODE=$?
        OUTPUT=$(cat "$TEST_OUTPUT")
        set -e

        # SwiftPM binary artifact resolution can occasionally fail on ephemeral
        # runners with "Could not resolve package dependencies". Retry once after
        # clearing SwiftPM/DerivedData caches to recover from transient corruption.
        if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "Could not resolve package dependencies"; then
          echo "SwiftPM package resolution failed, clearing caches and retrying once"
          rm -rf ~/Library/Caches/org.swift.swiftpm
          mkdir -p ~/Library/Caches/org.swift.swiftpm
          rm -rf "$BMUX_DERIVED_DATA_PATH"
          mkdir -p "$BMUX_DERIVED_DATA_PATH"
          set +e
          run_unit_tests | tee "$TEST_OUTPUT"
          EXIT_CODE=$?
          OUTPUT=$(cat "$TEST_OUTPUT")
          set -e
        fi

        # XCTest handles genuine expected failures in the native exit status.
        # A partial log summary cannot turn a failure or timeout into success.
        exit "$EXIT_CODE"
    - name: Collect app-host failure evidence
      if: ${{ always() }}
      run: |
        # Diagnostics cannot replace the native step's exit or consume its deadline.
        scripts/ci/run-in-console-session.sh python3 scripts/ci/app_host_failure_evidence.py collect-pending \
          --output "$RUNNER_TEMP/bmux-failure-evidence" || \
          echo "App-host failure evidence incomplete; native test result is unchanged"
    - name: Upload sanitized app-host failure evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: app-host-failure-evidence-${{ matrix.shard }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/bmux-failure-evidence/**/report.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload app-host process diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: app-host-process-diagnostics-${{ matrix.shard }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/bmux-process-diagnostics/
        if-no-files-found: ignore
    - name: Run bundled Ghostty theme picker helper regression
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_THEME_PICKER_REGRESSION_SHARD) }}
      run: |
        set -euo pipefail
        BMUX_SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages" \
          ./tests/test_bundled_ghostty_theme_picker_helper.sh
    - name: Run CLI no-socket regressions
      if: ${{ matrix.shard == fromJSON(env.BMUX_APP_HOST_CLI_NO_SOCKET_REGRESSION_SHARD) }}
      run: |
        set -euo pipefail

        CLI_BIN="$(
          find "$BMUX_DERIVED_DATA_PATH" -path "*/Build/Products/Debug/bmux" -exec stat -f '%m %N' {} \; \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-
        )"
        if [ -z "${CLI_BIN:-}" ] || [ ! -x "$CLI_BIN" ]; then
          echo "bmux CLI binary not found in DerivedData" >&2
          exit 1
        fi

        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_version_memory_guard.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_contract_help.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_layout_focus_contract.py
        BMUX_CLI_BIN="$CLI_BIN" python3 tests/test_cli_socket_operation_deadline.py
