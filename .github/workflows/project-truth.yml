name: Project Truth

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: project-truth
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    env:
      PROJECT_TRUTH_SHARED_STATE: .project-truth/provenance-engine/project/project-state.yaml
      PROJECT_TRUTH_TOOL_ROOT: .project-truth/provenance-engine/tools/project-docs
    steps:
      - name: Checkout bmux
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout Provenance Engine tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: BrianBusby/provenance-engine
          path: .project-truth/provenance-engine

      - name: Use dependency Provenance Engine branch when declared
        env:
          PEER_REPOSITORY: BrianBusby/provenance-engine
          PEER_PATH: .project-truth/provenance-engine
          CURRENT_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          peer_ref="$(python3 <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["PEER_REPOSITORY"]
          current_ref = os.environ.get("CURRENT_REF", "")
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          body = ""

          if event_path and os.path.exists(event_path):
              with open(event_path, "r", encoding="utf-8") as handle:
                  event = json.load(handle)
              body = (event.get("pull_request") or {}).get("body") or ""

          match = re.search(rf"{re.escape(repository)}#(\d+)", body)
          dependency_ref = None

          if match:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/pulls/{match.group(1)}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "project-truth-ci",
                  },
              )
              token = os.environ.get("GITHUB_TOKEN")
              if token:
                  request.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      pull_request = json.load(response)
                  head = pull_request.get("head") or {}
                  head_repo = (head.get("repo") or {}).get("full_name")
                  if head_repo == repository:
                      dependency_ref = head.get("ref")
              except Exception:
                  dependency_ref = None

          print(dependency_ref or current_ref)
          PY
          )"
          if [ -z "$peer_ref" ] || [ "$peer_ref" = "main" ]; then
            exit 0
          fi
          if git -C "$PEER_PATH" ls-remote --exit-code --heads origin "$peer_ref" >/dev/null 2>&1; then
            git -C "$PEER_PATH" fetch --depth=1 origin "$peer_ref"
            git -C "$PEER_PATH" checkout --detach FETCH_HEAD
          fi

      - name: Install Project Truth dependencies
        run: python3 -m pip install -r .project-truth/provenance-engine/tools/project-docs/requirements.txt

      - name: Validate manifests
        run: ./scripts/project-docs validate

      - name: Check generated docs
        run: ./scripts/project-docs check

      - name: Run read-only CI validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/project-docs ci --peer-repo-root .project-truth/provenance-engine
