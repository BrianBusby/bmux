    - id: app_runtime_service_lifecycle_migration
      kind: slice
      title: Mobile Host and Presence Lifecycle Migration
      parent: app_runtime_composition_migration
      status: implemented
      owner: bmux
      repositories:
        - bmux
      concept_classification:
        primary: platform
        architecture_layer: platform
        tags:
          - process_integrity
          - app_runtime_composition
          - deferred_service_migration
          - mobile_host_presence
      capability_maturity: validated
      depends_on:
        - deterministic_app_runtime_composition
      enables:
        - app_runtime_browser_devtools_lifecycle_migration
      gates:
        - id: runtime_composition_validated
          requires:
            node: deterministic_app_runtime_composition
            maturity: validated
          reason: Additional background services should migrate only after the first PE-backed production/test composition path is validated.
      parallelism:
        classification: serial
        expected_contract_domains:
          - mobile_host_listener
          - network_path_monitor
          - mobile_route_publication
          - presence_heartbeat
          - mobile_event_observers
        expected_code_areas:
          - Sources/AppDelegate*.swift
          - Sources/App/BmuxAppRuntime*.swift
          - Sources/Mobile
          - Sources/Cloud
          - bmuxTests/*Mobile*Tests.swift
          - bmuxTests/AppRuntimeCompositionTests.swift
        likely_conflict_domains:
          - app_delegate_startup
          - app_host_test_side_effects
          - global_singletons
      execution:
        assignment: complete
        assigned_to: bmux
      delivery_status: merged
      acceptance_status: implemented
      rationale: Follow-up Process Integrity slice to migrate the macOS mobile-host listener, network-path monitoring, route publication, presence heartbeat, device registry route publication, paired-Mac backup route publication, and directly coupled mobile event observers behind the app-runtime composition boundary.
      acceptance:
        criteria:
          - BmuxAppRuntimeConfiguration exposes an explicit mobile-host/presence capability that production enables and default XCTest composition disables.
          - AppDelegate and migrated app startup/termination paths can only start, sync, or stop the selected service family through BmuxAppRuntimeServices.
          - Focused tests can opt into mobile-host/presence with injected dependencies and no real listener bind, path monitor, route publication, presence heartbeat, device registry, or paired-Mac backup traffic.
          - Mobile-host lifecycle state distinguishes disabled-by-composition, disabled-by-settings, starting, ready/listening, degraded, failed, stopping, and stopped states.
          - Preferred-port fallback is degraded-but-listening, while presence or route-publication failure degrades publication without failing a healthy local listener.
          - Settings enable, disable, re-enable, and auth-availability changes reconcile through one runtime owner without duplicate listeners, observers, monitors, or presence loops.
          - Shutdown cancels composition-owned settings/status observers, workspace-list observers, render observation, route publication, presence heartbeat, device registry publication, paired-Mac backup publication, listener/path monitoring, and active mobile-host connections.
          - Retained singleton compatibility access cannot become a second lifecycle owner, and removal conditions are documented.
          - A runtime-composition boundary guard rejects migrated direct startup/configuration/termination calls outside the declared runtime owner.
          - Production-path coverage exercises production configuration through app runtime composition into mobile-host readiness, route publication evaluation, and deterministic shutdown.

      completed_at: '2026-09-07'
      evidence:
        commits:
          - repository: BrianBusby/bmux
