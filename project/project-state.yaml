    - id: post_merge_project_truth_reconciliation
      kind: slice
      title: Post-Merge Project Truth Reconciliation and Capability-Frontier Advancement
      parent: post_merge_project_truth_reconciliation_milestone
      status: implemented
      owner: bmux
      repositories:
        - bmux
        - provenance_engine
      concept_classification:
        primary: project_truth
        architecture_layer: cross_repository_workflow
        tags:
          - process_integrity
          - project_truth_reconciliation
          - post_merge_delivery
          - capability_frontier
      capability_maturity: validated
      depends_on:
        - project_truth_capability_frontier_governance
      enables:
        - app_runtime_service_lifecycle_migration
      parallelism:
        classification: serial
        expected_contract_domains:
          - post_merge_delivery_reconciliation
          - github_merge_evidence
          - active_work_state
          - capability_frontier_recalculation
          - reconciliation_pr_deduplication
        expected_code_areas:
          - tools/project-docs/project_docs.py
          - tools/project-docs/tests/test_project_docs.py
          - tools/project-docs/README.md
          - project/README.md
          - project/project-state.yaml
          - project/repo-status.yaml
          - project/schema/project-state.schema.json
          - .github/workflows/project-truth.yml
          - .github/workflows/project-truth-reconcile.yml
          - docs/process-integrity/post-merge-reconciliation-audit.md
          - docs/generated
        likely_conflict_domains:
          - project_truth_manifest
          - project_docs_generation
          - github_evidence_validation
          - github_actions_project_truth
        contract_dependencies:
          - project_truth_generated_docs
          - project_docs_validation
          - github_evidence_validation
        worktree_required: true
      execution:
        assignment: complete
        assigned_to: bmux
      delivery_status: merged
      acceptance_status: implemented
      rationale: Add a canonical reconcile check/apply command that reads Project Truth and GitHub evidence, applies only mechanically justified delivery transitions, clears stale active work, advances ready candidates, regenerates docs atomically, and reports remaining human planning decisions.
      acceptance:
        criteria:
          - Reconciliation check mode is read-only, actionable, and exits nonzero when safe changes or explicit decisions remain.
          - Reconciliation apply mode updates only canonical manifests and generated docs, validates in a temporary copy, stages destination-side replacements with rollback, and is idempotent on a second run.
          - Merged PR evidence records merge timestamp and merge commit identity after GitHub verification.
          - Active branch/worktree assignments for completed delivery are cleared without selecting the next priority automatically.
          - Capability-frontier candidates whose declared gates are now satisfied become ready but remain unselected until a human chooses them.
          - CI detects stale recorded delivery evidence and post-merge automation opens or updates one bounded reconciliation PR with explicit remote-branch lease protection, validates safe diffs without discarding unrelated explicit decisions, then dispatches normal validation workflows for that branch.

      evidence:
