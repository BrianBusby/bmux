      execution:
        assignment: complete
        assigned_to: bmux
      delivery_status: merged
      acceptance_status: implemented
      rationale: Move WorkProvenanceRuntime construction/startup and related agent-chat PE projection startup behind one app-runtime composition owner so production starts PE deliberately, default app-host tests cannot open the production PE database, opted-in tests use isolated storage, and migrated services expose deterministic readiness/failure/teardown.
      acceptance:
        criteria:
          - App runtime composition is the only production source path that constructs the live WorkProvenanceRuntime.
          - BmuxAppRuntimeServices is the only production source path that starts PE workspace observation and agent-chat execution telemetry projection.
          - Default app-host XCTest composition disables PE without opening the production PE database.
          - Tests can opt into PE with a temporary home directory and observe ready, failed, and stopped lifecycle states without sleeps or timing assertions.
          - Runtime shutdown cancels migrated observation work and releases owned lifecycle tasks.
          - A source guard prevents migrated app entrypoints from bypassing the composition boundary.
          - Existing Session-tab production lifecycle coverage still reaches PE readiness through deterministic task completion.
          - Production PE prompt evidence appends scope turn-outcome evidence acquisition to the affected session instead of scanning unrelated ledger history.
          - Agent-chat startup prompt seeding skips ended historical Codex hook-store records while preserving non-ended live startup backfill and live UserPromptSubmit prompt evidence.

      completed_at: '2026-09-05'
