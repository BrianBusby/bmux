          - lifecycle_ownership
      parallelism:
        classification: serial
        expected_contract_domains:
          - project_truth_reconciliation
          - app_runtime_composition
          - app_host_test_isolation
          - provenance_runtime_policy
          - legacy_provenance_retirement
          - deterministic_test_burndown
