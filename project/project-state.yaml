          - Same-named milestones or repeated session-scoped semantic ids from different sessions remain distinct, and one session's claims never clear, resolve, or supersede another session's blockers or approach history.
          - Partial history, unavailable semantic records, stale evidence, bounded omissions, and unknown older-model fields remain explicitly distinguishable from empty, complete, or resolved work state after encoding and decoding.
          - Large semantic payloads are bounded deterministically with omission reasons and counts while retained items keep enough provenance to interpret their original source records.
          - Semantic work-state fields remain separate from factual relationship reasons, Session Outcome, Turn Outcome, factual Current State, artifact-collision facts, prompt injection, coordination policy, and Knowledge Compiler behavior.
          - A public-read example demonstrates the carried cross-session work state and limitations using sanitized fixture data.
      acceptance_reason: >-
        Rich cross-session work-state semantics is implemented and merged through
        PR #87. Related-session rule version 2 carries existing SessionWorkModel milestones,
        blockers, approach changes, thread/turn intent, current activity, and session
        phase with source-session scope, semantic record identity, bounded payloads,
        evidence references, producer metadata, supporting factual revision, supersession
        metadata, explicit unknown/unavailable/partial availability, and deterministic
        content revision behavior. Validation used synthetic sanitized multi-session
        fixtures, public SDK reads, restart/rebuild and historical-revision coverage,
        focused related-session/blocker/approach suites, the full ProvenanceEngine
        package suite, foreground Codex review, and Project Truth gates. Agent-accessible
        retrieval is not selected or implemented by this slice.
      rationale: Add richer validated semantic information to related-session briefs only after PE owns the underlying milestone, blocker, validation, and approach-change semantics.

